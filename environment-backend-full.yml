name: peach-backend-full
channels:
  - conda-forge
  - nodefaults
dependencies:
  - aiofiles
  - copulae
  - filelock
  - flit >=3.11.0
  - geopandas
  - gunicorn
  - h5netcdf
  - h5py
  - lmoments3
  - numpy >=2.0
  - openturns >=1.24,<1.27
  - pandas >=2.0
  - param
  - pip >=25.2
  - pyextremes
  - pygeoapi
  - python >=3.12,<3.13
  - s3fs
  - scipy >=1.11.0
  - sphinx
  - starlette
  - uvicorn[standard]
  - xarray >=2023.11.0,!=2024.10.0
  - xclim ==0.60
  - yaml
  - zarr
